(()=>{const db=window.supabase.createClient('https://evjzwhqheycsmvmjnclf.supabase.co','sb_publishable_OUTOekYvhOgwpiYLniSRvA_javLnkuJ'),el=document.getElementById('list'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));db.from('wedding_venues').select('venue_name,location,district,venue_type,capacity,price_range,description,amenities,photos,phone').eq('status','approved').order('created_at',{ascending:false}).then(({data,error})=>{if(error||!data?.length){el.innerHTML='<div class="empty">Venues are being added. You can register your venue here.</div>';return;}el.innerHTML=data.map(v=>{const p=v.photos||[],phone=String(v.phone||'').replace(/\D/g,'');return '<article class="card">'+(p[0]?'<img class="heroimg" src="'+esc(p[0])+'" alt="'+esc(v.venue_name)+'" loading="lazy">':'')+(p.length>1?'<div class="thumbs">'+p.slice(1).map(x=>'<img src="'+esc(x)+'" alt="Venue photo" loading="lazy">').join('')+'</div>':'')+'<div class="body"><h2>'+esc(v.venue_name)+'</h2><div class="muted">📍 '+esc(v.location)+(v.district?' · '+esc(v.district):'')+'</div><p><span class="pill">'+esc(v.venue_type)+'</span>'+(v.capacity?'<span class="pill">Up to '+esc(v.capacity)+' guests</span>':'')+'</p><p>'+esc(v.description)+'</p>'+(v.amenities||[]).map(a=>'<span class="pill">'+esc(a)+'</span>').join('')+'<p><b>'+esc(v.price_range||'Contact for price')+'</b></p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/91'+phone+'?text='+encodeURIComponent('Namaste, I found '+v.venue_name+' on PahadiWedding.in. Please share availability and package details.')+'">Enquire on WhatsApp</a></div></article>';}).join('');});})();</script></body></html>
