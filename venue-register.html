h>8){out.textContent='Choose 1–8 photos.';return;}if(!/^[0-9]{10}$/.test($('phone').value.trim())){out.textContent='Enter valid 10 digit phone.';return;}btn.disabled=true;out.textContent='Uploading photos…';try{const photos=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10485760)throw Error('Each photo must be JPG/PNG/WebP under 10 MB.');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path='applications/'+Date.now()+'-'+Math.random().toString(36).slice(2,9)+'.'+ext,{error}=await db.storage.from('venue-images').upload(path,file,{contentType:file.type});if(error)throw error;photos.push(db.storage.from('venue-images').getPublicUrl(path).data.publicUrl);}const name=$('name').value.trim(),slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString().slice(-6),row={venue_name:name,slug,owner_name:$('owner').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim()||null,location:$('location').value.trim(),district:$('district').value||null,venue_type:$('type').value,capacity:Number($('capacity').value)||null,price_range:$('price').value.trim()||null,description:$('description').value.trim(),amenities:$('amenities').value.split(',').map(x=>x.trim()).filter(Boolean),photos,status:'pending'},{error}=await db.from('wedding_venues').insert(row);if(error)throw error;out.textContent='Thank you! Venue application submitted. Admin approval ke baad listing live hogi.';$('f').reset();}catch(err){out.textContent='Submission failed: '+err.message;}finally{btn.disabled=false;}});})();</script></body></html>
